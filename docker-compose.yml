services:
  db:
    image: postgres:16-alpine
    container_name: rwb-postgres
    environment:
      POSTGRES_DB: rwb
      POSTGRES_USER: rwb
      POSTGRES_PASSWORD: rwb
    ports:
      - "5432:5432"
    volumes:
      - rwb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rwb -d rwb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rwb-pgdata:
